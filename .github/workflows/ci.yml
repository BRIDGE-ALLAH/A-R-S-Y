name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node for A-R-S-Y dashboard
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build A-R-S-Y dashboard assets
        working-directory: dashboard
        run: npm install --no-audit --no-fund && npm run build
      - name: Verify module graph
        run: go mod verify
      - name: Test
        run: go test ./...
      - name: Build standalone server
        run: mkdir -p .builds && CGO_ENABLED=0 go build -o .builds/arsy ./examples/base
      - name: Run A-R-S-Y diagnostics
        run: ARSY_DATA_DIR="$(mktemp -d)/arsy" ARSY_SECRET_KEY="ci-only-diagnostic-key" .builds/arsy doctor

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build UI
        run: npm run build

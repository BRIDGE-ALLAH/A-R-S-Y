name: Format relation metadata (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/aeng-024-field-metadata

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/aeng-025-relation-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aeng-025-relation-metadata
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Format relation package
        run: gofmt -w arsy/engine/relations/*.go
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add arsy/engine/relations/*.go
            git commit -m "style(aeng): format relation metadata package"
            git push origin HEAD:feat/aeng-025-relation-metadata
          fi

name: Format field metadata (temporary)

on:
  push:
    branches:
      - feat/aeng-024-field-metadata

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aeng-024-field-metadata
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Format field metadata package
        run: gofmt -w arsy/engine/fields/*.go
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add arsy/engine/fields/*.go
            git commit -m "style(aeng): format field metadata package"
            git push origin HEAD:feat/aeng-024-field-metadata
          fi
